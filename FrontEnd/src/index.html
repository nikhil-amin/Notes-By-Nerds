<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes By Nerds</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
    body {
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color:white;
    }

    .myLogo {
      width: 150px;
      margin-bottom: 2rem;
      animation: logoBounce 1s ease infinite alternate;
    }

    @keyframes logoBounce {
      0% {transform: translateY(0);}
      100% {transform: translateY(-15px);}
    }

    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .loader-item {
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      animation: bounce 1s infinite ease-in-out;
    }

    .loader-item:nth-child(1) {animation-delay: 0s;}
    .loader-item:nth-child(2) {animation-delay: 0.1s;}
    .loader-item:nth-child(3) {animation-delay: 0.2s;}
    .loader-item:nth-child(4) {animation-delay: 0.3s;}
    .loader-item:nth-child(5) {animation-delay: 0.4s;}
    .loader-item:nth-child(6) {animation-delay: 0.5s;}

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @media (max-width: 480px) {
      .myLogo {width: 120px;}
      .loader-item {width: 10px; height: 10px;}
    }
  </style>
</head>
<body>
  <app-root>
    <img src="assets/logo.png" class="myLogo" alt="Notes By Nerds Logo">
    <div class="loader">
      <span class="loader-item"></span>
      <span class="loader-item"></span>
      <span class="loader-item"></span>
      <span class="loader-item"></span>
      <span class="loader-item"></span>
      <span class="loader-item"></span>
    </div>
  </app-root>
</body>
</html>
